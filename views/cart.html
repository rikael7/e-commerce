<header class="topbar">
  <div class="container">

    </div>
    <div class="header-links">
      <div class="h-item">📋 Meus Pedidos</div>
      <div class="h-item">👤 Entre ou Cadastre-se</div>
    </div>
  </div>
</header>

<div class="container cart-page">
  <div class="cart-grid">
    <div class="cart-main-col">
      <div id="cartMainArea"></div>

      <div class="reco-section">
        <h3>Principais ofertas para você</h3>
        <div class="prod-scroll-wrap">
          <div class="prod-grid" id="grid-reco">
            <div class="prod-state">Carregando produtos...</div>
          </div>
        </div>
      </div>
    </div>

    <aside class="summary-card">
      <h3>Resumo do pedido</h3>
      <div id="summaryBody">
        <p class="summary-empty-text">Assim que adicionar produtos ao carrinho, aqui você vai encontrar o resumo do seu pedido.</p>
      </div>
    </aside>
  </div>
</div>

<script>
const CART_KEY = "carrinho";
const API_BASE = "";
const PRODUCTS_ENDPOINT = API_BASE + "/api/mercadopago/produtos";
const PEDIDOS_ENDPOINT = API_BASE + "/api/mercadopago/pedidos";

function formatBRL(valor){
  const n = Number(valor) || 0;
  return n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
}

function getCarrinho(){
  return JSON.parse(localStorage.getItem(CART_KEY)) || [];
}

function salvarCarrinho(carrinho){
  localStorage.setItem(CART_KEY, JSON.stringify(carrinho));
  renderCart();
}

function alterarQuantidade(id, delta){
  const carrinho = getCarrinho();
  const item = carrinho.find(i => i.id === id);
  if (!item) return;
  item.quantidade += delta;
  if (item.quantidade <= 0) return removerDoCarrinho(id);
  salvarCarrinho(carrinho);
}

function removerDoCarrinho(id){
  const carrinho = getCarrinho().filter(i => i.id !== id);
  salvarCarrinho(carrinho);
}

function renderCart(){
  const carrinho = getCarrinho();
  const mainArea = document.getElementById("cartMainArea");
  const summaryBody = document.getElementById("summaryBody");

  if (!carrinho.length){
    mainArea.innerHTML = `
      <div class="empty-card">
        <h2>Seu carrinho está vazio</h2>
        <div class="empty-icon">🛍️</div>
        <p>Encontre os produtos que deseja adicionar ao carrinho.</p>
        <a href="index.html" class="btn-outline">Conferir produtos</a>
      </div>`;
    summaryBody.innerHTML = `<p class="summary-empty-text">Assim que adicionar produtos ao carrinho, aqui você vai encontrar o resumo do seu pedido.</p>`;
    return;
  }

  const subtotal = carrinho.reduce((s, i) => s + i.preco * i.quantidade, 0);

  mainArea.innerHTML = `
    <div class="cart-list-card">
      <div class="cart-list-head">Meu carrinho (${carrinho.reduce((s,i)=>s+i.quantidade,0)} ${carrinho.length === 1 ? "item" : "itens"})</div>
      ${carrinho.map(item => `
        <div class="cart-row">
          <div class="cr-thumb">${item.imagem ? `<img src="${item.imagem}" alt="${item.nome}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🔧'}))">` : "🔧"}</div>
          <div class="cr-info">
            <div class="cr-name">${item.nome}</div>
            <div class="cr-unit">${formatBRL(item.preco)} / unidade</div>
            <div class="cr-qty">
              <button onclick="alterarQuantidade('${item.id}', -1)">−</button>
              <span>${item.quantidade}</span>
              <button onclick="alterarQuantidade('${item.id}', 1)">+</button>
            </div>
            <button class="cr-remove" onclick="removerDoCarrinho('${item.id}')">Remover</button>
          </div>
          <div class="cr-total">${formatBRL(item.preco * item.quantidade)}</div>
        </div>
      `).join("")}
    </div>`;

  summaryBody.innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span>${formatBRL(subtotal)}</span></div>
    <div class="summary-row"><span>Frete</span><span>Calculado no próximo passo</span></div>
    <div class="summary-row total"><span>Total</span><span>${formatBRL(subtotal)}</span></div>
    <button id="btnFinalizarCompra" class="summary-checkout" onclick="finalizarCompra()">Finalizar compra</button>
    <div class="summary-error" id="summaryError"></div>
    <div class="summary-note">Pagamento processado via Mercado Pago</div>
  `;
}

async function finalizarCompra(){
  const carrinho = getCarrinho();
  const btn = document.getElementById("btnFinalizarCompra");
  const erroBox = document.getElementById("summaryError");

  erroBox.classList.remove("show");
  erroBox.textContent = "";

  if (!carrinho.length){
    erroBox.textContent = "Seu carrinho está vazio.";
    erroBox.classList.add("show");
    return;
  }

  const itens = carrinho.map(item => ({
    produtoId: Number(item.id),
    quantidade: item.quantidade
  }));

  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Processando...";

  try{
    const res = await fetch(PEDIDOS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ itens })
    });

    const data = await res.json();

    if (!res.ok){
      throw new Error(data.erro || "Não foi possível criar o pedido.");
    }

    // Pedido criado com sucesso: limpa o carrinho local e segue pro checkout/pagamento
    localStorage.removeItem(CART_KEY);
    window.location.href = `checkout.html?pedidoId=${data.pedidoId}`;
  }catch(err){
    console.error("Erro ao finalizar compra:", err);
    erroBox.textContent = err.message || "Erro ao finalizar compra. Tente novamente.";
    erroBox.classList.add("show");
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

/* ===== Recomendações (mesma API de produtos) ===== */
function normalizeProduct(p){
  return {
    id: p.id,
    nome: p.nome ?? "Produto sem nome",
    descricao: p.descricao ?? "",
    preco: p.preco ?? 0,
    estoque: p.estoque ?? 0,
    imagem: p.imagem_url ?? null
  };
}

function productCardHTML(p){
  const semEstoque = Number(p.estoque) <= 0;
  const estoqueTag = semEstoque
    ? `<div class="badge-discount" style="background:#8a8a8a;">Indisponível</div>`
    : (Number(p.estoque) <= 5 ? `<div class="badge-discount">Últimas ${p.estoque}</div>` : "");
  const imgHTML = p.imagem
    ? `<img src="${p.imagem}" alt="${p.nome}" loading="lazy" style="width:100%;height:100%;object-fit:cover;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🔧',style:'font-size:32px;opacity:.3;'}))">`
    : `<span style="font-size:32px;opacity:.3;">🔧</span>`;
  return `
    <div class="product-card" data-id="${p.id}">
      ${estoqueTag}
      <div class="img-wrap">${imgHTML}</div>
      <div class="p-body">
        <div class="p-name">${p.nome}</div>
        <div class="price">${formatBRL(p.preco)}</div>
        <div class="installments">ou em até 12x no cartão</div>
        <div class="buy-row">
          <input class="qty" type="number" min="1" value="1" ${semEstoque ? "disabled" : ""}>
          <button class="add-btn" onclick="addToCartFromReco('${p.id}')" ${semEstoque ? "disabled style='opacity:.5;cursor:not-allowed;'" : ""}>
            ${semEstoque ? "Indisponível" : "Adicionar"}
          </button>
        </div>
      </div>
    </div>`;
}

function addToCartFromReco(id){
  const card = document.querySelector(`#grid-reco .product-card[data-id="${id}"]`);
  if (!card) return;
  const nome = card.querySelector(".p-name")?.textContent?.trim() || "Produto";
  const precoTexto = card.querySelector(".price")?.textContent?.trim() || "R$ 0,00";
  const preco = Number(precoTexto.replace(/[^\d,-]/g, "").replace(".", "").replace(",", ".")) || 0;
  const imgEl = card.querySelector(".img-wrap img");
  const imagem = imgEl ? imgEl.getAttribute("src") : null;
  const qtyInput = card.querySelector(".qty");
  const quantidade = Math.max(1, parseInt(qtyInput?.value, 10) || 1);

  const carrinho = getCarrinho();
  const existente = carrinho.find(item => item.id === id);
  if (existente){
    existente.quantidade += quantidade;
  } else {
    carrinho.push({ id, nome, preco, quantidade, imagem });
  }
  salvarCarrinho(carrinho);

  const btn = card.querySelector(".add-btn");
  if (btn){
    const original = btn.textContent;
    btn.textContent = "Adicionado ✓";
    setTimeout(() => { btn.textContent = original; }, 1200);
  }
}

async function loadRecommendations(){
  const el = document.getElementById("grid-reco");
  try{
    const res = await fetch(PRODUCTS_ENDPOINT);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rawList = Array.isArray(data) ? data : (data.produtos || data.data || []);
    const produtos = rawList.map(normalizeProduct);
    if (!produtos.length){
      el.innerHTML = `<div class="prod-state">Nenhum produto encontrado.</div>`;
      return;
    }
    el.innerHTML = produtos.slice(0, 8).map(productCardHTML).join("");
  }catch(err){
    console.error("Erro ao buscar produtos:", err);
    el.innerHTML = `<div class="prod-state">Não foi possível carregar as recomendações (${PRODUCTS_ENDPOINT}).</div>`;
  }
}

renderCart();
loadRecommendations();
</script>
</body>

    font-size:13.5px;
  }

  .cart-row .cr-remove{
    background:none;
    border:0;
    color:#c0392b;
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    margin-top:8px;
  }

  .cart-row .cr-total{
    width:120px;
    text-align:right;
    font-weight:800;
    font-size:16px;
    flex-shrink:0;
  }

  /* ===== SUMMARY ===== */

  .summary-card{
    background:#fff;
    border-radius:var(--card-radius);
    padding:22px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    position:sticky;
    top:84px;
  }

  .summary-card h3{
    font-size:17px;
    margin-bottom:14px;
  }

  .summary-empty-text{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
  }

  .summary-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:10px;
  }

  .summary-row span:last-child{
    text-align:right;
  }

  .summary-row.total{
    color:var(--text);
    font-weight:800;
    font-size:16px;
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:6px;
  }

  .summary-checkout{
    display:block;
    width:100%;
    text-align:center;
    background:var(--orange);
    color:#fff;
    font-weight:700;
    padding:13px;
    border-radius:6px;
    font-size:14px;
    margin-top:16px;
    border:0;
    cursor:pointer;
    font-family:inherit;
  }

  .summary-checkout:hover{
    background:var(--orange-dark);
  }

  .summary-checkout:disabled{
    opacity:.6;
    cursor:not-allowed;
  }

  .summary-error{
    background:#fdecea;
    color:#c0392b;
    border:1px solid #f5c6cb;
    border-radius:6px;
    padding:10px 12px;
    font-size:12.5px;
    margin-top:12px;
    display:none;
  }

  .summary-error.show{
    display:block;
  }

  .summary-note{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
  }

  /* ===== RECOMMENDATIONS ===== */

  .reco-section{
    margin-top:34px;
    min-width:0;
  }

  .reco-section h3{
    font-size:18px;
    margin-bottom:14px;
  }

  .prod-scroll-wrap{
    position:relative;
    width:100%;
    max-width:100%;
    overflow:hidden;
  }

  .prod-grid{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:200px;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
    max-width:100%;
  }

  .product-card{
    background:#fff;
    border-radius:var(--card-radius);
    overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .product-card .badge-discount{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--orange);
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:3px 7px;
    border-radius:4px;
    z-index:2;
  }

  .product-card .img-wrap{
    aspect-ratio:1;
    background:var(--gray-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .product-card .p-body{
    padding:10px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }

  .product-card .p-name{
    font-size:12.5px;
    font-weight:600;
    line-height:1.3;
    min-height:32px;
  }

  .product-card .price{
    font-size:18px;
    font-weight:800;
    color:var(--text);
  }

  .product-card .installments{
    font-size:10.5px;
    color:var(--muted);
  }

  .product-card .buy-row{
    display:flex;
    gap:6px;
    margin-top:auto;
    padding-top:8px;
  }

  .product-card .qty{
    width:34px;
    border:1px solid #ddd;
    border-radius:5px;
    text-align:center;
    font-size:12px;
    padding:6px 0;
    color:var(--muted);
  }

  .product-card .add-btn{
    flex:1;
    background:var(--orange);
    color:#fff;
    border:0;
    border-radius:5px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }

  .prod-state{
    padding:24px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }

  /* ===== RESPONSIVE ===== */

  @media (max-width:860px){
    .cart-grid{
      grid-template-columns:1fr;
    }

    .summary-card{
      position:static;
    }

    .search-bar{
      order:3;
      flex-basis:100%;
    }

    .header-links{
      gap:16px;
    }
  }

  @media (max-width:640px){
    header.topbar .container{
      flex-wrap:wrap;
      gap:12px;
    }

    .logo{
      width:100%;
    }

    .header-links{
      display:none;
    }

    .cart-row{
      align-items:flex-start;
    }

    .cart-row .cr-total{
      width:auto;
      font-size:14px;
    }

    .cart-row .cr-thumb{
      width:64px;
      height:64px;
    }
  }
</style>
</head>

<body>

<header class="topbar">
  <div class="container">

    <a class="logo" href="index.html">
      🔧 Loja do Mecânico
    </a>

    <div class="search-bar">
      <input
        type="text"
        placeholder="Busque por produtos, marcas ou categorias"
      >
      <button type="button">🔍</button>
    </div>

    <div class="header-links">
      <div class="h-item">📋 Meus Pedidos</div>
      <div class="h-item">👤 Entre ou Cadastre-se</div>
    </div>

  </div>
</header>


<div class="container cart-page">

  <div class="cart-grid">

    <div class="cart-main-col">

      <div id="cartMainArea"></div>

      <div class="reco-section">

        <h3>Principais ofertas para você</h3>

        <div class="prod-scroll-wrap">

          <div class="prod-grid" id="grid-reco">

            <div class="prod-state">
              Carregando produtos...
            </div>

          </div>

        </div>

      </div>

    </div>


    <aside class="summary-card">

      <h3>Resumo do pedido</h3>

      <div id="summaryBody">

        <p class="summary-empty-text">
          Assim que adicionar produtos ao carrinho,
          aqui você vai encontrar o resumo do seu pedido.
        </p>

      </div>

    </aside>

  </div>

</div>


<script>

const CART_KEY = "carrinho";

const API_BASE = "";

const PRODUCTS_ENDPOINT =
  API_BASE + "/api/mercadopago/produtos";


/* ==========================================================
   FORMATAÇÃO DE PREÇO
========================================================== */

function formatBRL(valor){

  const n = Number(valor) || 0;

  return n.toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });

}


/* ==========================================================
   CARRINHO
========================================================== */

function getCarrinho(){

  try{

    const dados =
      JSON.parse(localStorage.getItem(CART_KEY));

    return Array.isArray(dados) ? dados : [];

  }catch(err){

    console.error(
      "Erro ao ler carrinho:",
      err
    );

    return [];

  }

}


function salvarCarrinho(carrinho){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(carrinho)
  );

  renderCart();

}


/* ==========================================================
   ALTERAR QUANTIDADE
========================================================== */

function alterarQuantidade(id, delta){

  const carrinho = getCarrinho();

  const item = carrinho.find(
    i => String(i.id) === String(id)
  );

  if (!item) return;

  item.quantidade =
    Number(item.quantidade) + Number(delta);

  if (item.quantidade <= 0){

    removerDoCarrinho(id);

    return;

  }

  salvarCarrinho(carrinho);

}


/* ==========================================================
   REMOVER PRODUTO
========================================================== */

function removerDoCarrinho(id){

  const carrinho =
    getCarrinho().filter(
      item => String(item.id) !== String(id)
    );

  salvarCarrinho(carrinho);

}


/* ==========================================================
   RENDERIZAR CARRINHO
========================================================== */

function renderCart(){

  const carrinho = getCarrinho();

  const mainArea =
    document.getElementById("cartMainArea");

  const summaryBody =
    document.getElementById("summaryBody");


  /* ============================
     CARRINHO VAZIO
  ============================ */

  if (!carrinho.length){

    mainArea.innerHTML = `

      <div class="empty-card">

        <h2>
          Seu carrinho está vazio
        </h2>

        <div class="empty-icon">
          🛍️
        </div>

        <p>
          Encontre os produtos que deseja
          adicionar ao carrinho.
        </p>

        <a
          href="index.html"
          class="btn-outline"
        >
          Conferir produtos
        </a>

      </div>

    `;


    summaryBody.innerHTML = `

      <p class="summary-empty-text">
        Assim que adicionar produtos ao carrinho,
        aqui você vai encontrar o resumo do seu pedido.
      </p>

    `;

    return;

  }


  /* ============================
     SUBTOTAL
  ============================ */

  const subtotal = carrinho.reduce(
    (total, item) => {

      const preco =
        Number(item.preco) || 0;

      const quantidade =
        Number(item.quantidade) || 0;

      return total + (
        preco * quantidade
      );

    },
    0
  );


  /* ============================
     LISTA DE PRODUTOS
  ============================ */

  mainArea.innerHTML = `

    <div class="cart-list-card">

      <div class="cart-list-head">

        Meu carrinho
        (${carrinho.reduce(
          (s,i) => s + Number(i.quantidade || 0),
          0
        )}
        ${
          carrinho.reduce(
            (s,i) => s + Number(i.quantidade || 0),
            0
          ) === 1
            ? "item"
            : "itens"
        })

      </div>


      ${carrinho.map(item => `

        <div class="cart-row">

          <div class="cr-thumb">

            ${
              item.imagem

              ? `

                <img
                  src="${item.imagem}"
                  alt="${item.nome || "Produto"}"
                  style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:8px;
                  "
                  onerror="
                    this.replaceWith(
                      Object.assign(
                        document.createElement('span'),
                        {textContent:'🔧'}
                      )
                    )
                  "
                >

              `

              : "🔧"

            }

          </div>


          <div class="cr-info">

            <div class="cr-name">
              ${item.nome || "Produto"}
            </div>


            <div class="cr-unit">

              ${formatBRL(item.preco)}
              / unidade

            </div>


            <div class="cr-qty">

              <button
                type="button"
                onclick="alterarQuantidade('${item.id}', -1)"
              >
                −
              </button>


              <span>
                ${Number(item.quantidade) || 0}
              </span>


              <button
                type="button"
                onclick="alterarQuantidade('${item.id}', 1)"
              >
                +
              </button>

            </div>


            <button
              type="button"
              class="cr-remove"
              onclick="removerDoCarrinho('${item.id}')"
            >
              Remover
            </button>

          </div>


          <div class="cr-total">

            ${formatBRL(
              (Number(item.preco) || 0) *
              (Number(item.quantidade) || 0)
            )}

          </div>

        </div>

      `).join("")}

    </div>

  `;


  /* ============================
     RESUMO
  ============================ */

  summaryBody.innerHTML = `

    <div class="summary-row">

      <span>
        Subtotal
      </span>

      <span>
        ${formatBRL(subtotal)}
      </span>

    </div>


    <div class="summary-row">

      <span>
        Frete
      </span>

      <span>
        Calculado no próximo passo
      </span>

    </div>


    <div class="summary-row total">

      <span>
        Total
      </span>

      <span>
        ${formatBRL(subtotal)}
      </span>

    </div>


    <button
      type="button"
      id="btnFinalizarCompra"
      class="summary-checkout"
      onclick="finalizarCompra()"
    >
      Finalizar compra
    </button>


    <div
      class="summary-error"
      id="summaryError"
    ></div>


    <div class="summary-note">

      Pagamento processado via Mercado Pago

    </div>

  `;

}


/* ==========================================================
   FINALIZAR COMPRA

   IMPORTANTE:
   O carrinho NÃO cria o pedido.

   Ele apenas verifica se existem produtos
   e redireciona para o checkout.

   O checkout vai:
   1. Ler o localStorage
   2. Coletar os dados do cliente
   3. Enviar tudo para POST /pedidos
========================================================== */

function finalizarCompra(){

  const carrinho = getCarrinho();

  const btn =
    document.getElementById(
      "btnFinalizarCompra"
    );

  const erroBox =
    document.getElementById(
      "summaryError"
    );


  if (!btn || !erroBox){

    return;

  }


  erroBox.classList.remove("show");

  erroBox.textContent = "";


  /* ============================
     NÃO PERMITE CARRINHO VAZIO
  ============================ */

  if (!carrinho.length){

    erroBox.textContent =
      "Seu carrinho está vazio. Adicione pelo menos um produto para continuar.";

    erroBox.classList.add("show");

    return;

  }


  /* ============================
     VAI PARA O CHECKOUT

     NÃO REMOVE O LOCALSTORAGE.

     O checkout ainda precisa dos produtos.
  ============================ */

  btn.disabled = true;

  btn.textContent =
    "Abrindo checkout...";


  window.location.href =
    "/checkout";

}


/* ==========================================================
   NORMALIZA PRODUTO
========================================================== */

function normalizeProduct(p){

  return {

    id: p.id,

    nome:
      p.nome ?? "Produto sem nome",

    descricao:
      p.descricao ?? "",

    preco:
      p.preco ?? 0,

    estoque:
      p.estoque ?? 0,

    imagem:
      p.imagem_url ?? null

  };

}


/* ==========================================================
   HTML DO CARD DE PRODUTO
========================================================== */

function productCardHTML(p){

  const semEstoque =
    Number(p.estoque) <= 0;


  const estoqueTag = semEstoque

    ? `

      <div
        class="badge-discount"
        style="background:#8a8a8a;"
      >
        Indisponível
      </div>

    `

    : (

      Number(p.estoque) <= 5

      ? `

        <div class="badge-discount">
          Últimas ${p.estoque}
        </div>

      `

      : ""

    );


  const imgHTML = p.imagem

    ? `

      <img
        src="${p.imagem}"
        alt="${p.nome}"
        loading="lazy"
        style="
          width:100%;
          height:100%;
          object-fit:cover;
        "
        onerror="
          this.replaceWith(
            Object.assign(
              document.createElement('span'),
              {
                textContent:'🔧',
                style:'font-size:32px;opacity:.3;'
              }
            )
          )
        "
      >

    `

    : `

      <span
        style="
          font-size:32px;
          opacity:.3;
        "
      >
        🔧
      </span>

    `;


  return `

    <div
      class="product-card"
      data-id="${p.id}"
    >

      ${estoqueTag}


      <div class="img-wrap">

        ${imgHTML}

      </div>


      <div class="p-body">

        <div class="p-name">

          ${p.nome}

        </div>


        <div class="price">

          ${formatBRL(p.preco)}

        </div>


        <div class="installments">

          ou em até 12x no cartão

        </div>


        <div class="buy-row">

          <input
            class="qty"
            type="number"
            min="1"
            value="1"
            ${semEstoque ? "disabled" : ""}
          >


          <button
            type="button"
            class="add-btn"
            onclick="addToCartFromReco('${p.id}')"
            ${
              semEstoque
                ? "disabled style='opacity:.5;cursor:not-allowed;'"
                : ""
            }
          >

            ${
              semEstoque
                ? "Indisponível"
                : "Adicionar"
            }

          </button>

        </div>

      </div>

    </div>

  `;

}


/* ==========================================================
   ADICIONAR RECOMENDAÇÃO AO CARRINHO
========================================================== */

function addToCartFromReco(id){

  const card =
    document.querySelector(
      `#grid-reco .product-card[data-id="${id}"]`
    );

  if (!card) return;


  const nome =
    card.querySelector(
      ".p-name"
    )?.textContent?.trim()
    || "Produto";


  const precoTexto =
    card.querySelector(
      ".price"
    )?.textContent?.trim()
    || "R$ 0,00";


  const preco =
    Number(
      precoTexto
        .replace(/[^\d,-]/g, "")
        .replace(".", "")
        .replace(",", ".")
    ) || 0;


  const imgEl =
    card.querySelector(
      ".img-wrap img"
    );


  const imagem =
    imgEl
      ? imgEl.getAttribute("src")
      : null;


  const qtyInput =
    card.querySelector(".qty");


  const quantidade =
    Math.max(
      1,
      parseInt(
        qtyInput?.value,
        10
      ) || 1
    );


  const carrinho =
    getCarrinho();


  const existente =
    carrinho.find(
      item =>
        String(item.id) === String(id)
    );


  if (existente){

    existente.quantidade =
      Number(existente.quantidade) +
      quantidade;

  }else{

    carrinho.push({

      id,

      nome,

      preco,

      quantidade,

      imagem

    });

  }


  salvarCarrinho(carrinho);


  const btn =
    card.querySelector(
      ".add-btn"
    );


  if (btn){

    const original =
      btn.textContent;


    btn.textContent =
      "Adicionado ✓";


    setTimeout(() => {

      btn.textContent =
        original;

    }, 1200);

  }

}


/* ==========================================================
   CARREGAR RECOMENDAÇÕES
========================================================== */

async function loadRecommendations(){

  const el =
    document.getElementById(
      "grid-reco"
    );


  try{

    const res =
      await fetch(
        PRODUCTS_ENDPOINT
      );


    if (!res.ok){

      throw new Error(
        "HTTP " + res.status
      );

    }


    const data =
      await res.json();


    const rawList =
      Array.isArray(data)

        ? data

        : (
            data.produtos
            ||
            data.data
            ||
            []
          );


    const produtos =
      rawList.map(
        normalizeProduct
      );


    if (!produtos.length){

      el.innerHTML = `

        <div class="prod-state">
          Nenhum produto encontrado.
        </div>

      `;

      return;

    }


    el.innerHTML =
      produtos
        .slice(0, 8)
        .map(productCardHTML)
        .join("");


  }catch(err){

    console.error(
      "Erro ao buscar produtos:",
      err
    );


    el.innerHTML = `

      <div class="prod-state">

        Não foi possível carregar
        as recomendações.

      </div>

    `;

  }

}


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

renderCart();

loadRecommendations();

</script>

</body>
</html>
