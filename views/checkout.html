<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando para o pagamento — Loja do Mecânico</title>
<style>
  :root{
    --orange:#ff6a00;
    --navy:#0c1b3a;
    --black:#15151a;
    --gray-bg:#f2f2f4;
    --text:#1c1c22;
    --muted:#6b6b76;
    --border:#e6e6ea;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--gray-bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}
  .container{max-width:1200px;margin:0 auto;padding:0 16px;}

  header.topbar{background:var(--orange);padding:14px 0;}
  header.topbar .container{display:flex;align-items:center;gap:10px;}
  .logo img{height:30px;}

  .checkout-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 62px);padding:24px;}
  .checkout-card{background:#fff;border-radius:10px;padding:40px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .spinner{width:46px;height:46px;border:4px solid var(--border);border-top-color:var(--orange);border-radius:50%;margin:0 auto 20px;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .checkout-card h2{font-size:18px;margin-bottom:8px;}
  .checkout-card p{color:var(--muted);font-size:13.5px;line-height:1.5;}

  .error-box{display:none;}
  .error-box.show{display:block;}
  .error-box .err-icon{font-size:40px;margin-bottom:10px;}
  .error-box h2{color:#c0392b;}
  .btn-outline{display:inline-block;margin-top:20px;border:1.5px solid var(--orange);color:var(--orange);background:#fff8f2;font-weight:700;padding:11px 24px;border-radius:6px;font-size:13.5px;}
  .btn-solid{display:inline-block;margin-top:20px;background:var(--orange);color:#fff;font-weight:700;padding:11px 24px;border-radius:6px;font-size:13.5px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="logo" href="index.html"><img src="/midia/loja_do_mecanico.svg" alt="Loja do Mecânico"></a>
  </div>
</header>

<div class="checkout-wrap">
  <div class="checkout-card" id="loadingBox">
    <div class="spinner"></div>
    <h2>Preparando seu pagamento...</h2>
    <p>Aguarde um instante, estamos te redirecionando com segurança para o Mercado Pago.</p>
  </div>

  <div class="checkout-card error-box" id="errorBox">
    <div class="err-icon">⚠️</div>
    <h2 id="errorTitle">Não foi possível continuar</h2>
    <p id="errorMessage">Tente novamente em instantes.</p>
    <a href="carrinho.html" class="btn-outline">Voltar ao carrinho</a>
  </div>
</div>

<script>
/* ===========================================================
   Endpoint de criação de preferência do Mercado Pago.
   Ajuste o caminho conforme o seu mercadopagoRoutes real —
   este exemplo assume POST /api/mercadopago/preferencia
   (a função no controller é `criarPreferencia`).
=========================================================== */
const API_BASE = "";
const PREFERENCIA_ENDPOINT = API_BASE + "/api/mercadopago/preferencia";

function getPedidoId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("pedidoId");
}

function mostrarErro(titulo, mensagem){
  document.getElementById("loadingBox").style.display = "none";
  const box = document.getElementById("errorBox");
  document.getElementById("errorTitle").textContent = titulo;
  document.getElementById("errorMessage").textContent = mensagem;
  box.classList.add("show");
}

async function iniciarPagamento(){
  const pedidoId = getPedidoId();

  if (!pedidoId){
    mostrarErro("Pedido não encontrado", "Não recebemos o identificador do pedido. Volte ao carrinho e tente novamente.");
    return;
  }

  try{
    const res = await fetch(PREFERENCIA_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedidoId })
    });

    const data = await res.json();

    if (!res.ok){
      throw new Error(data.erro || "Não foi possível gerar o link de pagamento.");
    }

    if (!data.initPoint){
      throw new Error("O Mercado Pago não retornou o link de pagamento.");
    }

    // Redireciona para o checkout do Mercado Pago (init_point)
    window.location.href = data.initPoint;
  }catch(err){
    console.error("Erro ao criar preferência de pagamento:", err);
    mostrarErro("Erro ao iniciar o pagamento", err.message || "Tente novamente em instantes.");
  }
}

iniciarPagamento();
</script>
</body>
</html>
