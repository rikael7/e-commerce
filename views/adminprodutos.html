<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Balcão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F2E7;
    --paper-dark: #EDE4D2;
    --ink: #1F3A2E;
    --ink-soft: #4A5E52;
    --stamp: #C23B22;
    --stamp-soft: #E8531F;
    --ok: #2F7A4D;
    --line: #C9BE9F;
    --white: #FFFDF8;
    --radius: 4px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper-dark);
    background-image: radial-gradient(circle at 1px 1px, rgba(31,58,46,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header{
    padding: 36px 24px 0;
    text-align: center;
  }
  header .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--stamp);
    display:inline-block;
    border: 1.5px solid var(--stamp);
    padding: 3px 10px;
    border-radius: 2px;
    transform: rotate(-2deg);
    margin-bottom: 14px;
  }
  header h1{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: clamp(28px, 4.5vw, 44px);
    margin: 0;
  }
  header p{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 10px;
  }

  /* ---- abas ---- */
  nav.abas{
    max-width: 960px;
    margin: 26px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
  }
  .aba-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .aba-btn.ativa{
    background: var(--white);
    color: var(--ink);
    font-weight: 600;
  }
  .aba-btn:hover:not(.ativa){ background: var(--paper-dark); }

  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .painel{ display: none; }
  .painel.ativo{ display: block; }

  /* ---- Produtos: grid form + lista ---- */
  #painel-produtos .grid{
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 760px){
    #painel-produtos .grid{ grid-template-columns: 1fr; }
  }

  .cartao{
    background: var(--white);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  #painel-produtos .cartao,
  #painel-pedidos .cartao{ border-top: none; }
  #form-wrap .cartao{ border-radius: var(--radius); border-top: 1px solid var(--line); }

  .cartao-head{
    padding: 16px 18px;
    border-bottom: 1px dashed var(--line);
    display:flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .cartao-head h2{ font-family: 'Bitter', serif; font-size: 16px; margin:0; }
  .cartao-head .info{ font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .cartao-head button.link{
    background: none;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  form{ padding: 18px; display: grid; gap: 14px; min-width: 0; }

  .campo{ display: grid; gap: 5px; min-width: 0; }
  .campo label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .campo input, .campo textarea{
    width: 100%;
    min-width: 0;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }
  .campo textarea{ resize: vertical; min-height: 56px; font-family: 'Inter', sans-serif; }
  .campo input:focus, .campo textarea:focus{
    outline: 2px solid var(--stamp-soft);
    outline-offset: 1px;
    border-color: var(--stamp-soft);
  }

  .linha-dupla{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }

  .campo-check{
    display:flex; align-items:center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .acoes-form{ display:flex; gap: 10px; margin-top: 4px; }

  .btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 11px 16px;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    flex: 1;
  }
  .btn-primario{ background: var(--ink); color: var(--white); }
  .btn-primario:hover{ background: #14261d; }
  .btn-secundario{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .btn-secundario:hover{ background: var(--paper-dark); }

  .form-msg{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    min-height: 16px;
  }
  .form-msg.erro{ color: var(--stamp); }
  .form-msg.ok{ color: var(--ink); }

  /* ---- tabelas ---- */
  table{ width: 100%; border-collapse: collapse; }
  thead th{
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    padding: 10px 14px;
    border-bottom: 1px solid var(--paper-dark);
  }
  tbody td{
    padding: 12px 14px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--paper-dark);
    vertical-align: middle;
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr.inativo{ opacity: 0.45; }

  .cel-nome .nome{ font-weight: 600; }
  .cel-nome .descricao{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .cel-preco{ font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .preco-antigo{
    font-size: 11.5px;
    color: var(--ink-soft);
    text-decoration: line-through;
    margin-bottom: 2px;
  }
  .preco-atual{ display: flex; align-items: center; gap: 8px; }
  .badge-desconto{
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--white);
    background: var(--ok);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .cel-estoque, .cel-id{ font-family: 'IBM Plex Mono', monospace; }

  .tag-inativo{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--stamp);
    border: 1px solid var(--stamp);
    border-radius: 2px;
    padding: 1px 5px;
    margin-left: 6px;
  }

  .cel-acoes{ white-space: nowrap; text-align: right; }
  .link-acao{
    background:none; border:none; cursor:pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    text-decoration: underline;
    padding: 0;
    margin-left: 12px;
  }
  .link-acao.excluir{ color: var(--stamp); }

  /* ---- filtros pedidos ---- */
  .filtros{ display:flex; gap: 6px; flex-wrap: wrap; }
  .filtro-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filtro-btn.ativo{ background: var(--ink); color: var(--white); border-color: var(--ink); }
  .filtro-btn:hover:not(.ativo){ background: var(--paper-dark); }

  .badge{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .badge.pendente{ background: #FBF0D9; color: #8A6A1F; border-color: #E4C685; }
  .badge.approved,
  .badge.aprovado{ background: #E4F1E8; color: var(--ok); border-color: #9FCBAE; }
  .badge.rejected,
  .badge.rejeitado,
  .badge.cancelled,
  .badge.cancelado{ background: #F8E4DF; color: var(--stamp); border-color: #E7ADA0; }
  .badge.in_process,
  .badge.em_processo{ background: #E9E4F5; color: #5A3FA3; border-color: #C6B8E8; }
  .badge.outro{ background: var(--paper-dark); color: var(--ink-soft); border-color: var(--line); }

  .estado{
    padding: 30px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }
  .estado.erro{ color: var(--stamp); }

  /* ---- linha de pedido clicável + detalhe em cascata ---- */
  .linha-pedido{ cursor: pointer; }
  .linha-pedido:hover{ background: var(--paper); }
  .linha-pedido.aberta{ background: var(--paper); }

  .cel-toggle{ width: 22px; text-align: center; }
  .cel-data-criacao{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .seta{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    transition: transform 0.18s ease;
  }
  .linha-pedido.aberta .seta{ transform: rotate(90deg); }

  .linha-detalhe td{
    padding: 0;
    border-bottom: 1px solid var(--paper-dark);
  }
  .detalhe-conteudo{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.22s ease, padding 0.22s ease;
    background: var(--paper);
  }
  .linha-detalhe.aberta .detalhe-conteudo{
    max-height: 900px;
    padding: 16px 18px;
  }

  .detalhe-secao{ margin-bottom: 16px; }
  .detalhe-secao:last-child{ margin-bottom: 0; }
  .detalhe-titulo{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--stamp);
    margin-bottom: 8px;
  }

  .detalhe-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px 20px;
  }

  .detalhe-itens{ display: grid; gap: 6px; }
  .item-linha{
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }
  .item-linha:last-child{ border-bottom: none; }
  .detalhe-item .rotulo{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }
  .detalhe-item .valor{
    font-size: 13.5px;
    word-break: break-word;
  }
  .detalhe-item .valor.mono{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }

  :focus-visible{ outline: 2px solid var(--stamp-soft); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Painel interno</span>
  <h1>Balcão</h1>
  <p>produtos e pedidos, tudo em um lugar só</p>
</header>

<nav class="abas">
  <button type="button" class="aba-btn ativa" data-aba="produtos">Produtos</button>
  <button type="button" class="aba-btn" data-aba="pedidos">Pedidos</button>
</nav>

<main>

  <!-- ===================== PAINEL: PRODUTOS ===================== -->
  <section id="painel-produtos" class="painel ativo">
    <div class="grid">
      <div id="form-wrap">
        <div class="cartao">
          <div class="cartao-head">
            <h2 id="form-titulo">Novo produto</h2>
            <button type="button" class="link" id="btn-cancelar-edicao" hidden>cancelar edição</button>
          </div>
          <form id="form-produto">
            <input type="hidden" id="produto-id">
            <div class="campo">
              <label for="produto-nome">Nome</label>
              <input type="text" id="produto-nome" required maxlength="120">
            </div>
            <div class="campo">
              <label for="produto-descricao">Descrição</label>
              <textarea id="produto-descricao" maxlength="300"></textarea>
            </div>
            <div class="linha-dupla">
              <div class="campo">
                <label for="produto-preco">Preço (R$)</label>
                <input type="number" id="produto-preco" step="0.01" min="0" required>
              </div>
              <div class="campo">
                <label for="produto-preco-antigo">Preço antigo (R$)</label>
                <input type="number" id="produto-preco-antigo" step="0.01" min="0" placeholder="opcional">
              </div>
            </div>
            <div class="campo">
              <label for="produto-estoque">Estoque</label>
              <input type="number" id="produto-estoque" step="1" min="0" required>
            </div>
            <label class="campo-check">
              <input type="checkbox" id="produto-ativo" checked>
              produto ativo (visível no balcão)
            </label>
            <div class="acoes-form">
              <button type="submit" class="btn btn-primario" id="btn-salvar">Adicionar produto</button>
            </div>
            <p class="form-msg" id="form-msg"></p>
          </form>
        </div>
      </div>

      <div class="cartao">
        <div class="cartao-head">
          <h2>Catálogo</h2>
          <span class="info" id="contagem-produtos"></span>
        </div>
        <div id="produtos-wrap">
          <div class="estado" id="estado-produtos">carregando produtos…</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== PAINEL: PEDIDOS ===================== -->
  <section id="painel-pedidos" class="painel">
    <div class="cartao">
      <div class="cartao-head">
        <h2>Todos os pedidos</h2>
        <div class="filtros" id="filtros-pedidos">
          <button type="button" class="filtro-btn ativo" data-status="todos">todos</button>
          <button type="button" class="filtro-btn" data-status="pendente">pendente</button>
          <button type="button" class="filtro-btn" data-status="approved">aprovado</button>
          <button type="button" class="filtro-btn" data-status="rejected">rejeitado</button>
        </div>
        <div>
          <span class="info" id="contagem-pedidos"></span>
          <button type="button" class="link" id="btn-atualizar-pedidos">atualizar</button>
        </div>
      </div>
      <div id="pedidos-wrap">
        <div class="estado" id="estado-pedidos">carregando pedidos…</div>
      </div>
    </div>
  </section>

</main>

<script>
  // Ajuste estas URLs se suas rotas estiverem montadas em outro prefixo.
  const API_PRODUTOS = '/api/produtos';
  const API_PEDIDOS = '/api/mercadopago/pedidos';

  function formatarMoeda(v){
    return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function formatarData(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }
  function formatarDataSimples(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleDateString('pt-BR', { timeZone: 'UTC' });
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // ===================== ABAS =====================
  const abaBtns = document.querySelectorAll('.aba-btn');
  const paineis = {
    produtos: document.getElementById('painel-produtos'),
    pedidos: document.getElementById('painel-pedidos'),
  };

  abaBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      abaBtns.forEach((b) => b.classList.remove('ativa'));
      btn.classList.add('ativa');

      Object.values(paineis).forEach((p) => p.classList.remove('ativo'));
      paineis[btn.dataset.aba].classList.add('ativo');

      if(btn.dataset.aba === 'pedidos' && pedidosCarregados === false){
        carregarPedidos();
      }
    });
  });

  // ===================== PRODUTOS =====================
  const form = document.getElementById('form-produto');
  const formTitulo = document.getElementById('form-titulo');
  const btnSalvar = document.getElementById('btn-salvar');
  const btnCancelarEdicao = document.getElementById('btn-cancelar-edicao');
  const formMsg = document.getElementById('form-msg');

  const campoId = document.getElementById('produto-id');
  const campoNome = document.getElementById('produto-nome');
  const campoDescricao = document.getElementById('produto-descricao');
  const campoPreco = document.getElementById('produto-preco');
  const campoPrecoAntigo = document.getElementById('produto-preco-antigo');
  const campoEstoque = document.getElementById('produto-estoque');
  const campoAtivo = document.getElementById('produto-ativo');

  const estadoProdutosEl = document.getElementById('estado-produtos');
  const produtosWrapEl = document.getElementById('produtos-wrap');
  const contagemProdutosEl = document.getElementById('contagem-produtos');

  function mostrarFormMsg(msg, tipo){
    formMsg.textContent = msg;
    formMsg.className = 'form-msg ' + (tipo || '');
  }

  function entrarModoEdicao(produto){
    campoId.value = produto.id;
    campoNome.value = produto.nome;
    campoDescricao.value = produto.descricao || '';
    campoPreco.value = produto.preco;
    campoPrecoAntigo.value = produto.preco_antigo || '';
    campoEstoque.value = produto.estoque;
    campoAtivo.checked = !!produto.ativo;

    formTitulo.textContent = 'Editar produto';
    btnSalvar.textContent = 'Salvar alterações';
    btnCancelarEdicao.hidden = false;
    mostrarFormMsg('');
    campoNome.focus();
  }

  function sairModoEdicao(){
    form.reset();
    campoId.value = '';
    campoAtivo.checked = true;
    formTitulo.textContent = 'Novo produto';
    btnSalvar.textContent = 'Adicionar produto';
    btnCancelarEdicao.hidden = true;
    mostrarFormMsg('');
  }

  btnCancelarEdicao.addEventListener('click', sairModoEdicao);

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const id = campoId.value;
    const payload = {
      nome: campoNome.value.trim(),
      descricao: campoDescricao.value.trim(),
      preco: Number(campoPreco.value),
      precoAntigo: campoPrecoAntigo.value ? Number(campoPrecoAntigo.value) : null,
      estoque: Number(campoEstoque.value),
      ativo: campoAtivo.checked,
    };

    if(!payload.nome){
      mostrarFormMsg('Informe o nome do produto.', 'erro');
      return;
    }

    if(payload.precoAntigo !== null && payload.precoAntigo <= payload.preco){
      mostrarFormMsg('O preço antigo deve ser maior que o preço atual.', 'erro');
      return;
    }

    btnSalvar.disabled = true;
    mostrarFormMsg(id ? 'salvando alterações…' : 'adicionando produto…');

    try{
      const url = id ? `${API_PRODUTOS}/${id}` : API_PRODUTOS;
      const metodo = id ? 'PUT' : 'POST';

      const resp = await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const dados = await resp.json();

      if(!resp.ok){
        throw new Error(dados.erro || 'Não foi possível salvar o produto.');
      }

      mostrarFormMsg(id ? 'produto atualizado.' : 'produto adicionado.', 'ok');
      sairModoEdicao();
      carregarProdutos();
    }catch(erro){
      console.error(erro);
      mostrarFormMsg(erro.message, 'erro');
    }finally{
      btnSalvar.disabled = false;
    }
  });

  async function carregarProdutos(){
    try{
      const resp = await fetch(API_PRODUTOS + '?todos=1');
      if(!resp.ok) throw new Error('Falha ao buscar produtos.');
      const produtos = await resp.json();
      renderizarProdutos(produtos);
    }catch(erro){
      console.error(erro);
      estadoProdutosEl.className = 'estado erro';
      estadoProdutosEl.textContent = 'não foi possível carregar os produtos. verifique se o servidor está no ar.';
      produtosWrapEl.innerHTML = '';
      produtosWrapEl.appendChild(estadoProdutosEl);
    }
  }

  function renderizarProdutos(produtos){
    if(!Array.isArray(produtos) || produtos.length === 0){
      produtosWrapEl.innerHTML = '<div class="estado">nenhum produto cadastrado ainda</div>';
      contagemProdutosEl.textContent = '';
      return;
    }

    contagemProdutosEl.textContent = produtos.length + ' item(ns)';

    const linhas = produtos.map((p) => `
      <tr class="${p.ativo ? '' : 'inativo'}" data-id="${p.id}">
        <td class="cel-nome">
          <div class="nome">${escapeHtml(p.nome)}${p.ativo ? '' : '<span class="tag-inativo">inativo</span>'}</div>
          ${p.descricao ? `<div class="descricao">${escapeHtml(p.descricao)}</div>` : ''}
        </td>
        <td class="cel-preco">
          ${p.desconto_percentual ? `<div class="preco-antigo">de ${formatarMoeda(p.preco_antigo)}</div>` : ''}
          <div class="preco-atual">
            ${formatarMoeda(p.preco)}
            ${p.desconto_percentual ? `<span class="badge-desconto">↓ ${p.desconto_percentual}%</span>` : ''}
          </div>
        </td>
        <td class="cel-estoque">${p.estoque}</td>
        <td class="cel-acoes">
          <button type="button" class="link-acao" data-acao="editar">editar</button>
          <button type="button" class="link-acao excluir" data-acao="excluir">excluir</button>
        </td>
      </tr>
    `).join('');

    produtosWrapEl.innerHTML = `
      <table>
        <thead>
          <tr><th>Produto</th><th>Preço</th><th>Estoque</th><th></th></tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    `;

    produtosWrapEl.querySelectorAll('tr[data-id]').forEach((linha) => {
      const id = linha.dataset.id;
      const produto = produtos.find((p) => String(p.id) === id);

      linha.querySelector('[data-acao="editar"]').addEventListener('click', () => {
        entrarModoEdicao(produto);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      linha.querySelector('[data-acao="excluir"]').addEventListener('click', () => {
        excluirProduto(id, produto.nome);
      });
    });
  }

  async function excluirProduto(id, nome){
    if(!confirm(`Remover "${nome}" do catálogo?`)) return;

    try{
      const resp = await fetch(`${API_PRODUTOS}/${id}`, { method: 'DELETE' });
      const dados = await resp.json();

      if(!resp.ok){
        throw new Error(dados.erro || 'Não foi possível remover o produto.');
      }

      carregarProdutos();
    }catch(erro){
      console.error(erro);
      alert(erro.message);
    }
  }

  // ===================== PEDIDOS =====================
  const pedidosWrapEl = document.getElementById('pedidos-wrap');
  const estadoPedidosEl = document.getElementById('estado-pedidos');
  const contagemPedidosEl = document.getElementById('contagem-pedidos');
  const filtrosPedidosEl = document.getElementById('filtros-pedidos');
  const btnAtualizarPedidos = document.getElementById('btn-atualizar-pedidos');

  let pedidos = [];
  let filtroPedidoAtual = 'todos';
  let pedidosCarregados = false;
  let pedidoAbertoId = null; // guarda qual pedido está expandido entre re-renders

  function classeBadge(status){
    if(!status) return 'outro';
    const chave = status.toLowerCase();
    const permitidos = ['pendente','approved','aprovado','rejected','rejeitado','cancelled','cancelado','in_process','em_processo'];
    return permitidos.includes(chave) ? chave : 'outro';
  }

  async function carregarPedidos(){
    estadoPedidosEl.className = 'estado';
    estadoPedidosEl.textContent = 'carregando pedidos…';
    pedidosWrapEl.innerHTML = '';
    pedidosWrapEl.appendChild(estadoPedidosEl);

    try{
      const resp = await fetch(API_PEDIDOS);
      if(!resp.ok) throw new Error('Falha ao buscar pedidos.');
      pedidos = await resp.json();
      pedidosCarregados = true;
      renderizarPedidos();
    }catch(erro){
      console.error(erro);
      estadoPedidosEl.className = 'estado erro';
      estadoPedidosEl.textContent = 'não foi possível carregar os pedidos. verifique se o servidor está no ar.';
    }
  }

  function renderizarPedidos(){
    const filtrados = filtroPedidoAtual === 'todos'
      ? pedidos
      : pedidos.filter((p) => (p.status_pagamento || '').toLowerCase() === filtroPedidoAtual);

    if(!Array.isArray(pedidos) || pedidos.length === 0){
      pedidosWrapEl.innerHTML = '<div class="estado">nenhum pedido registrado ainda</div>';
      contagemPedidosEl.textContent = '';
      return;
    }

    if(filtrados.length === 0){
      pedidosWrapEl.innerHTML = '<div class="estado">nenhum pedido com esse status</div>';
      contagemPedidosEl.textContent = '0 de ' + pedidos.length;
      return;
    }

    contagemPedidosEl.textContent = filtrados.length + ' de ' + pedidos.length;

    const linhas = filtrados.map((p) => {
      const aberta = String(p.id) === String(pedidoAbertoId);
      return `
        <tr class="linha-pedido ${aberta ? 'aberta' : ''}" data-id="${p.id}">
          <td class="cel-toggle"><span class="seta">▶</span></td>
          <td class="cel-id">#${p.id}</td>
          <td class="cel-nome">
            <div class="nome">${escapeHtml(p.nome_completo || '—')}</div>
            <div class="descricao">${escapeHtml(p.email || '')}</div>
          </td>
          <td class="cel-preco">${formatarMoeda(p.valor_total)}</td>
          <td><span class="badge ${classeBadge(p.status_pagamento)}">${p.status_pagamento || 'sem status'}</span></td>
          <td class="cel-data-criacao">${formatarData(p.criado_em)}</td>
        </tr>
        <tr class="linha-detalhe ${aberta ? 'aberta' : ''}" data-detalhe-id="${p.id}">
          <td colspan="6">
            <div class="detalhe-conteudo">
              <div class="detalhe-secao">
                <div class="detalhe-titulo">Comprador</div>
                <div class="detalhe-grid">
                  <div class="detalhe-item">
                    <div class="rotulo">CPF/CNPJ</div>
                    <div class="valor mono">${escapeHtml(p.cpf_cnpj || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Telefone</div>
                    <div class="valor">${escapeHtml(p.telefone || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Data de nascimento</div>
                    <div class="valor">${formatarDataSimples(p.data_nascimento)}</div>
                  </div>
                </div>
              </div>

              <div class="detalhe-secao">
                <div class="detalhe-titulo">Endereço de entrega</div>
                <div class="detalhe-grid">
                  <div class="detalhe-item">
                    <div class="rotulo">CEP</div>
                    <div class="valor mono">${escapeHtml(p.cep || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">País</div>
                    <div class="valor">${escapeHtml(p.pais || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Cidade / Estado</div>
                    <div class="valor">${escapeHtml(p.cidade || '—')}${p.estado ? ' / ' + escapeHtml(p.estado) : ''}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Bairro</div>
                    <div class="valor">${escapeHtml(p.bairro || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Rua / Número</div>
                    <div class="valor">${escapeHtml(p.rua || '—')}, ${escapeHtml(p.numero || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Complemento</div>
                    <div class="valor">${escapeHtml(p.complemento || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Ponto de referência</div>
                    <div class="valor">${escapeHtml(p.ponto_referencia || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Destinatário</div>
                    <div class="valor">${escapeHtml(p.nome_destinatario || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Telefone de entrega</div>
                    <div class="valor">${escapeHtml(p.telefone_entrega || '—')}</div>
                  </div>
                </div>
              </div>

              <div class="detalhe-secao">
                <div class="detalhe-titulo">Itens do pedido</div>
                <div class="detalhe-itens">
                  ${
                    Array.isArray(p.itens) && p.itens.length > 0
                      ? p.itens.map((item) => `
                          <div class="item-linha">
                            <span>${escapeHtml(item.titulo)} × ${item.quantidade}</span>
                            <span class="mono">${formatarMoeda(item.preco)}</span>
                          </div>
                        `).join('')
                      : '<div class="detalhe-item"><div class="valor">itens não disponíveis</div></div>'
                  }
                </div>
              </div>

              <div class="detalhe-secao">
                <div class="detalhe-grid">
                  <div class="detalhe-item">
                    <div class="rotulo">Payment ID</div>
                    <div class="valor mono">${escapeHtml(p.payment_id || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Preference ID</div>
                    <div class="valor mono">${escapeHtml(p.preference_id || '—')}</div>
                  </div>
                  <div class="detalhe-item">
                    <div class="rotulo">Criado em</div>
                    <div class="valor mono">${formatarData(p.criado_em)}</div>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    pedidosWrapEl.innerHTML = `
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    `;

    pedidosWrapEl.querySelectorAll('.linha-pedido').forEach((linha) => {
      linha.addEventListener('click', () => {
        const id = linha.dataset.id;
        pedidoAbertoId = (pedidoAbertoId === id) ? null : id;
        renderizarPedidos();
      });
    });
  }

  filtrosPedidosEl.addEventListener('click', (evento) => {
    const botao = evento.target.closest('.filtro-btn');
    if(!botao) return;

    filtrosPedidosEl.querySelectorAll('.filtro-btn').forEach((b) => b.classList.remove('ativo'));
    botao.classList.add('ativo');
    filtroPedidoAtual = botao.dataset.status;
    pedidoAbertoId = null;
    renderizarPedidos();
  });

  btnAtualizarPedidos.addEventListener('click', carregarPedidos);

  // ===================== INÍCIO =====================
  carregarProdutos();
</script>

</body>
</html>
