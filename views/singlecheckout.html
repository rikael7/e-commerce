<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar pedido</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

.header-container {
    max-width: 1100px;
    margin: auto;
}

header h1 {
    font-size: 24px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 25px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 25px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.card h2 {
    margin-bottom: 20px;
    font-size: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

.required {
    color: red;
}

.products {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.product {
    display: flex;
    gap: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid #eee;
}

.product:last-child {
    border-bottom: none;
}

.product img {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
}

.product-info {
    flex: 1;
}

.product-name {
    font-weight: bold;
    margin-bottom: 6px;
}

.product-price {
    color: #555;
}

.product-quantity {
    margin-top: 5px;
    font-size: 14px;
}

.summary {
    position: sticky;
    top: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.summary-total {
    border-top: 1px solid #ddd;
    padding-top: 15px;
    margin-top: 15px;
    font-size: 21px;
    font-weight: bold;
}

.btn {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 8px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.btn:hover {
    background: #15803d;
}

.btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.success {
    background: #dcfce7;
    color: #166534;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.loading {
    text-align: center;
    padding: 20px;
    display: none;
}

@media (max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .summary {
        position: static;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-container">
        <h1>Finalizar pedido</h1>
    </div>
</header>

<div class="container">

    <div id="mensagemErro" class="error"></div>
    <div id="mensagemSucesso" class="success"></div>

    <div class="loading" id="loading">
        Processando pedido...
    </div>

    <div class="layout">

        <!-- FORMULÁRIO -->
        <div>

            <!-- DADOS DO CLIENTE -->
            <div class="card">

                <h2>Dados pessoais</h2>

                <div class="form-grid">

                    <div class="form-group full">
                        <label>
                            Nome completo <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="nomeCompleto"
                            name="nomeCompleto"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            E-mail <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            CPF/CNPJ <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="cpfCnpj"
                            name="cpfCnpj"
                            placeholder="CPF ou CNPJ"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Telefone <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="dataNascimento"
                            name="dataNascimento"
                        >
                    </div>

                </div>

            </div>


            <!-- ENDEREÇO -->
            <div class="card">

                <h2>Endereço de entrega</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>
                            CEP <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            autocomplete="postal-code"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            País <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="pais"
                            name="pais"
                            value="Brasil"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Estado <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            placeholder="RS"
                            maxlength="2"
                            autocomplete="address-level1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Cidade <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Bairro <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Rua <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="rua"
                            name="rua"
                            autocomplete="street-address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Número <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Complemento
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Apartamento, bloco..."
                        >
                    </div>

                    <div class="form-group full">
                        <label>
                            Ponto de referência
                        </label>

                        <input
                            type="text"
                            id="pontoReferencia"
                            name="pontoReferencia"
                            placeholder="Ex: próximo ao supermercado"
                        >
                    </div>

                </div>

            </div>


            <!-- DESTINATÁRIO -->
            <div class="card">

                <h2>Destinatário</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>
                            Nome do destinatário <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="nomeDestinatario"
                            name="nomeDestinatario"
                            placeholder="Quem receberá o pedido?"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Telefone para entrega <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="telefoneEntrega"
                            name="telefoneEntrega"
                            placeholder="(00) 00000-0000"
                            required
                        >
                    </div>

                </div>

            </div>

        </div>


        <!-- RESUMO -->
        <div>

            <div class="card summary">

                <h2>Resumo do pedido</h2>

                <div id="listaProdutos" class="products">
                    <!-- Produtos carregados pelo JS -->
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">
                        R$ 0,00
                    </strong>
                </div>

                <div class="summary-row">
                    <span>Frete</span>
                    <strong>Grátis</strong>
                </div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <strong id="total">
                        R$ 0,00
                    </strong>
                </div>

                <button
                    type="button"
                    class="btn"
                    id="btnFinalizar"
                >
                    Continuar para pagamento
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/*
====================================================
CONFIGURAÇÃO
====================================================
*/

/*
 * ALTERE SOMENTE SE SUAS ROTAS FOREM DIFERENTES.
 *
 * Exemplo:
 *
 * POST /api/mercadopago/pedido
 * POST /api/mercadopago/preferencia
 *
 */

const API_PEDIDO = '/api/mercadopago/pedido';

const API_PREFERENCIA = '/api/mercadopago/preferencia';


/*
====================================================
ESTADO
====================================================
*/

let carrinho = [];


/*
====================================================
ELEMENTOS
====================================================
*/

const listaProdutos = document.getElementById('listaProdutos');

const subtotalElement = document.getElementById('subtotal');

const totalElement = document.getElementById('total');

const btnFinalizar = document.getElementById('btnFinalizar');

const mensagemErro = document.getElementById('mensagemErro');

const mensagemSucesso = document.getElementById('mensagemSucesso');

const loading = document.getElementById('loading');


/*
====================================================
FORMATAÇÃO
====================================================
*/

function formatarMoeda(valor) {

    return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });

}


/*
====================================================
MENSAGENS
====================================================
*/

function mostrarErro(mensagem) {

    mensagemErro.textContent = mensagem;

    mensagemErro.style.display = 'block';

    mensagemSucesso.style.display = 'none';

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


function mostrarSucesso(mensagem) {

    mensagemSucesso.textContent = mensagem;

    mensagemSucesso.style.display = 'block';

    mensagemErro.style.display = 'none';

}


/*
====================================================
LOCAL STORAGE
====================================================
*/

function carregarCarrinho() {

    /*
     * Tenta encontrar o carrinho em possíveis
     * nomes utilizados pelo seu projeto.
     */

    const possiveisChaves = [
        'carrinho',
        'cart',
        'shoppingCart'
    ];

    let dados = null;

    for (const chave of possiveisChaves) {

        const valor = localStorage.getItem(chave);

        if (!valor) {
            continue;
        }

        try {

            const parsed = JSON.parse(valor);

            if (Array.isArray(parsed)) {

                dados = parsed;

                console.log(
                    `Carrinho encontrado no localStorage: ${chave}`
                );

                break;
            }

        } catch (erro) {

            console.error(
                `Erro ao ler ${chave}:`,
                erro
            );

        }

    }


    if (!dados || dados.length === 0) {

        mostrarErro(
            'Seu carrinho está vazio. Adicione produtos antes de continuar.'
        );

        btnFinalizar.disabled = true;

        return;

    }


    /*
     * Normaliza os dados do carrinho.
     */

    carrinho = dados
        .map(item => {

            const produtoId =
                item.produtoId ??
                item.id ??
                item.productId;

            const quantidade =
                Number(
                    item.quantidade ??
                    item.quantity ??
                    1
                );

            const preco =
                Number(
                    item.preco ??
                    item.price ??
                    0
                );

            const nome =
                item.nome ??
                item.name ??
                item.titulo ??
                'Produto';

            const imagem =
                item.imagem_url ??
                item.imagem ??
                item.image ??
                item.imageUrl ??
                '';

            return {
                produtoId: Number(produtoId),
                quantidade,
                preco,
                nome,
                imagem
            };

        })
        .filter(item =>
            Number.isInteger(item.produtoId) &&
            item.produtoId > 0 &&
            item.quantidade > 0
        );


    if (carrinho.length === 0) {

        mostrarErro(
            'Não foi possível identificar os produtos do carrinho.'
        );

        btnFinalizar.disabled = true;

        return;

    }


    renderizarCarrinho();

}


/*
====================================================
RENDERIZAR CARRINHO
====================================================
*/

function renderizarCarrinho() {

    listaProdutos.innerHTML = '';

    let total = 0;


    carrinho.forEach(item => {

        const subtotal =
            item.preco * item.quantidade;

        total += subtotal;


        const produto = document.createElement('div');

        produto.className = 'product';


        let imagemHTML = '';

        if (item.imagem) {

            imagemHTML = `
                <img
                    src="${item.imagem}"
                    alt="${item.nome}"
                    onerror="this.style.display='none'"
                >
            `;

        } else {

            imagemHTML = `
                <div
                    style="
                        width:75px;
                        height:75px;
                        background:#eee;
                        border-radius:8px;
                    "
                ></div>
            `;

        }


        produto.innerHTML = `

            ${imagemHTML}

            <div class="product-info">

                <div class="product-name">
                    ${item.nome}
                </div>

                <div class="product-price">
                    ${formatarMoeda(item.preco)}
                </div>

                <div class="product-quantity">
                    Quantidade: ${item.quantidade}
                </div>

            </div>

            <strong>
                ${formatarMoeda(subtotal)}
            </strong>

        `;


        listaProdutos.appendChild(produto);

    });


    subtotalElement.textContent =
        formatarMoeda(total);

    totalElement.textContent =
        formatarMoeda(total);

}


/*
====================================================
OBTER VALOR DOS CAMPOS
====================================================
*/

function valor(id) {

    const elemento =
        document.getElementById(id);

    if (!elemento) {
        return '';
    }

    return elemento.value.trim();

}


/*
====================================================
VALIDAÇÃO DO FORMULÁRIO
====================================================
*/

function validarFormulario() {

    const campos = {

        nomeCompleto:
            'Nome completo',

        email:
            'E-mail',

        cpfCnpj:
            'CPF/CNPJ',

        telefone:
            'Telefone',

        cep:
            'CEP',

        pais:
            'País',

        estado:
            'Estado',

        cidade:
            'Cidade',

        bairro:
            'Bairro',

        rua:
            'Rua',

        numero:
            'Número',

        nomeDestinatario:
            'Nome do destinatário',

        telefoneEntrega:
            'Telefone para entrega'

    };


    for (const [id, nome] of Object.entries(campos)) {

        const campo =
            document.getElementById(id);

        if (!campo) {

            mostrarErro(
                `Campo ${nome} não encontrado no formulário.`
            );

            return false;

        }


        if (!campo.value.trim()) {

            campo.focus();

            mostrarErro(
                `Preencha o campo "${nome}".`
            );

            return false;

        }

    }


    /*
     * Validação adicional importante.
     */

    const nomeCompleto =
        valor('nomeCompleto');

    const partesNome =
        nomeCompleto
            .split(/\s+/)
            .filter(Boolean);


    if (partesNome.length < 2) {

        document
            .getElementById('nomeCompleto')
            .focus();

        mostrarErro(
            'Digite seu nome completo, incluindo nome e sobrenome.'
        );

        return false;

    }


    /*
     * E-mail
     */

    const email =
        valor('email');

    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!emailRegex.test(email)) {

        document
            .getElementById('email')
            .focus();

        mostrarErro(
            'Digite um e-mail válido.'
        );

        return false;

    }


    return true;

}


/*
====================================================
MONTAR BODY DO PEDIDO
====================================================
*/

function montarDadosPedido() {

    /*
     * IMPORTANTE:
     *
     * Os nomes abaixo são EXATAMENTE os nomes
     * esperados pelo seu controller.
     */

    return {

        itens: carrinho.map(item => ({

            produtoId:
                item.produtoId,

            quantidade:
                item.quantidade

        })),


        nomeCompleto:
            valor('nomeCompleto'),

        email:
            valor('email'),

        cpfCnpj:
            valor('cpfCnpj'),

        telefone:
            valor('telefone'),

        dataNascimento:
            valor('dataNascimento') || null,


        cep:
            valor('cep'),

        pais:
            valor('pais'),

        estado:
            valor('estado').toUpperCase(),

        cidade:
            valor('cidade'),

        bairro:
            valor('bairro'),

        rua:
            valor('rua'),

        numero:
            valor('numero'),

        complemento:
            valor('complemento') || null,

        pontoReferencia:
            valor('pontoReferencia') || null,


        nomeDestinatario:
            valor('nomeDestinatario'),

        telefoneEntrega:
            valor('telefoneEntrega')

    };

}


/*
====================================================
CRIAR PEDIDO
====================================================
*/

async function criarPedido() {

    const dadosPedido =
        montarDadosPedido();


    console.log(
        'Enviando pedido:',
        dadosPedido
    );


    const resposta =
        await fetch(API_PEDIDO, {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body:
                JSON.stringify(dadosPedido)

        });


    let dados;

    try {

        dados =
            await resposta.json();

    } catch {

        throw new Error(
            'O servidor retornou uma resposta inválida.'
        );

    }


    if (!resposta.ok) {

        throw new Error(
            dados.erro ||
            'Erro ao criar pedido.'
        );

    }


    /*
     * O seu controller retorna:
     *
     * {
     *   pedidoId,
     *   valorTotal,
     *   criadoEm,
     *   itens
     * }
     */

    if (!dados.pedidoId) {

        throw new Error(
            'O pedido foi criado, mas o servidor não retornou o pedidoId.'
        );

    }


    return dados;

}


/*
====================================================
CRIAR PREFERÊNCIA MERCADO PAGO
====================================================
*/

async function criarPreferencia(pedidoId) {

    console.log(
        'Criando preferência para pedido:',
        pedidoId
    );


    const resposta =
        await fetch(API_PREFERENCIA, {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({

                pedidoId: pedidoId

            })

        });


    let dados;

    try {

        dados =
            await resposta.json();

    } catch {

        throw new Error(
            'O servidor retornou uma resposta inválida ao criar o pagamento.'
        );

    }


    if (!resposta.ok) {

        throw new Error(
            dados.erro ||
            'Não foi possível criar o pagamento.'
        );

    }


    /*
     * Seu controller retorna:
     *
     * {
     *   preferenceId,
     *   initPoint
     * }
     */

    if (!dados.initPoint) {

        throw new Error(
            'O Mercado Pago não retornou o link de pagamento.'
        );

    }


    return dados;

}


/*
====================================================
FINALIZAR
====================================================
*/

async function finalizarPedido() {

    mensagemErro.style.display = 'none';

    mensagemSucesso.style.display = 'none';


    /*
     * Primeiro valida o formulário.
     */

    if (!validarFormulario()) {

        return;

    }


    /*
     * Segundo garante que existe carrinho.
     */

    if (!carrinho || carrinho.length === 0) {

        mostrarErro(
            'Seu carrinho está vazio.'
        );

        return;

    }


    /*
     * Desabilita botão para impedir
     * múltiplos pedidos.
     */

    btnFinalizar.disabled = true;

    btnFinalizar.textContent =
        'Criando pedido...';

    loading.style.display = 'block';


    try {

        /*
         * ETAPA 1
         *
         * Cria o pedido no banco.
         */

        const pedido =
            await criarPedido();


        console.log(
            'Pedido criado:',
            pedido
        );


        /*
         * Salva temporariamente o ID.
         *
         * Isso é útil caso a página seja redirecionada
         * ou para as páginas de sucesso/falha.
         */

        sessionStorage.setItem(
            'pedidoId',
            String(pedido.pedidoId)
        );


        /*
         * ETAPA 2
         *
         * Cria a preferência no Mercado Pago.
         */

        btnFinalizar.textContent =
            'Preparando pagamento...';


        const pagamento =
            await criarPreferencia(
                pedido.pedidoId
            );


        console.log(
            'Preferência criada:',
            pagamento
        );


        /*
         * ETAPA 3
         *
         * REDIRECIONAMENTO REAL.
         *
         * O initPoint vem do Mercado Pago.
         */

        btnFinalizar.textContent =
            'Redirecionando...';


        window.location.href =
            pagamento.initPoint;


    } catch (erro) {

        console.error(
            'Erro ao finalizar pedido:',
            erro
        );


        mostrarErro(
            erro.message ||
            'Não foi possível finalizar o pedido.'
        );


        btnFinalizar.disabled = false;

        btnFinalizar.textContent =
            'Continuar para pagamento';

        loading.style.display = 'none';

    }

}


/*
====================================================
BOTÃO
====================================================
*/

btnFinalizar.addEventListener(
    'click',
    finalizarPedido
);


/*
====================================================
INICIALIZAÇÃO
====================================================
*/

document.addEventListener(
    'DOMContentLoaded',
    () => {

        carregarCarrinho();

    }
);

</script>
