<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F2E7;
    --paper-dark: #EDE4D2;
    --ink: #1F3A2E;
    --ink-soft: #4A5E52;
    --stamp: #C23B22;
    --stamp-soft: #E8531F;
    --line: #C9BE9F;
    --white: #FFFDF8;
    --radius: 4px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper-dark);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,58,46,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header{
    padding: 40px 24px 24px;
    text-align: center;
  }

  header .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--stamp);
    display:inline-block;
    border: 1.5px solid var(--stamp);
    padding: 3px 10px;
    border-radius: 2px;
    transform: rotate(-2deg);
    margin-bottom: 14px;
  }

  header h1{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 52px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 10px;
  }

  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 24px 80px;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 820px){
    main{ grid-template-columns: 1fr; }
  }

  /* ---------- Product list ---------- */
  .stall{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .stall-head{
    padding: 18px 20px;
    border-bottom: 1px dashed var(--line);
    display:flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .stall-head h2{
    font-family: 'Bitter', serif;
    font-size: 18px;
    margin: 0;
  }

  .stall-head span{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  #produtos-lista{ padding: 6px 4px; }

  .produto{
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 16px 16px;
    border-bottom: 1px solid var(--paper-dark);
  }
  .produto:last-child{ border-bottom: none; }

  .produto .nome{
    font-weight: 600;
    font-size: 15px;
  }
  .produto .descricao{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .produto .estoque{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .produto .estoque.baixo{ color: var(--stamp); }

  .preco{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
  }

  .qtd-control{
    display:flex;
    align-items:center;
    border: 1px solid var(--ink);
    border-radius: 3px;
    overflow: hidden;
  }
  .qtd-control button{
    width: 28px; height: 28px;
    background: var(--paper);
    border: none;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink);
  }
  .qtd-control button:hover{ background: var(--paper-dark); }
  .qtd-control input{
    width: 34px;
    height: 28px;
    border: none;
    border-left: 1px solid var(--ink);
    border-right: 1px solid var(--ink);
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    -moz-appearance: textfield;
  }
  .qtd-control input::-webkit-outer-spin-button,
  .qtd-control input::-webkit-inner-spin-button{
    -webkit-appearance: none; margin:0;
  }

  .estado{
    padding: 30px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }
  .estado.erro{ color: var(--stamp); }

  /* ---------- Receipt / cart ---------- */
  .recibo-wrap{ position: sticky; top: 20px; }

  .recibo{
    background: var(--white);
    box-shadow: 0 12px 28px rgba(31,58,46,0.14);
    padding: 26px 22px 18px;
    position: relative;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 100%,
      95% 96%, 90% 100%, 85% 96%, 80% 100%, 75% 96%, 70% 100%,
      65% 96%, 60% 100%, 55% 96%, 50% 100%, 45% 96%, 40% 100%,
      35% 96%, 30% 100%, 25% 96%, 20% 100%, 15% 96%, 10% 100%, 5% 96%, 0% 100%
    );
    padding-bottom: 30px;
  }

  .recibo-titulo{
    font-family: 'Bitter', serif;
    font-weight: 700;
    font-size: 17px;
    text-align: center;
    margin: 0 0 2px;
  }
  .recibo-sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-align: center;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .recibo-linha{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 16px 0;
  }

  #carrinho-itens{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    min-height: 20px;
  }

  .item-linha{
    display:flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
  }
  .item-linha .nome-item{
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-linha .valor-item{ white-space: nowrap; }
  .item-linha .qtd-item{ color: var(--ink-soft); }

  .carrinho-vazio{
    text-align:center;
    color: var(--ink-soft);
    padding: 14px 0;
    font-size: 12px;
  }

  .recibo-total{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 10px;
  }
  .recibo-total .label{
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .recibo-total .valor{
    font-size: 22px;
    font-weight: 600;
  }

  .btn-pagar{
    width: 100%;
    margin-top: 18px;
    background: var(--ink);
    color: var(--white);
    border: none;
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-pagar:hover:not(:disabled){ background: #14261d; }
  .btn-pagar:active:not(:disabled){ transform: scale(0.99); }
  .btn-pagar:disabled{
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .status-msg{
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    min-height: 16px;
  }
  .status-msg.erro{ color: var(--stamp); }
  .status-msg.ok{ color: var(--ink); }

  .selo{
    position: absolute;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: 2px solid var(--stamp-soft);
    border-radius: 50%;
    color: var(--stamp-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    text-align:center;
    line-height: 1.1;
    transform: rotate(8deg);
    opacity: 0.85;
  }

  footer{
    text-align:center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    padding-bottom: 30px;
  }

  :focus-visible{
    outline: 2px solid var(--stamp-soft);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Pagamento via Mercado Pago</span>
  <h1>Balcão</h1>
  <p>escolha os itens · confira a nota · finalize o pagamento</p>
</header>

<main>
  <section class="stall">
    <div class="stall-head">
      <h2>Produtos disponíveis</h2>
      <span id="contagem-produtos"></span>
    </div>
    <div id="produtos-lista">
      <div class="estado" id="estado-produtos">carregando produtos…</div>
    </div>
  </section>

  <div class="recibo-wrap">
    <div class="recibo">
      <div class="selo">100%<br>seguro</div>
      <p class="recibo-titulo">Nota do pedido</p>
      <p class="recibo-sub">Balcão · checkout</p>
      <hr class="recibo-linha">
      <div id="carrinho-itens">
        <p class="carrinho-vazio">seu carrinho está vazio</p>
      </div>
      <hr class="recibo-linha">
      <div class="recibo-total">
        <span class="label">Total</span>
        <span class="valor" id="total-valor">R$ 0,00</span>
      </div>
      <button class="btn-pagar" id="btn-pagar" disabled>Pagar com Mercado Pago</button>
      <p class="status-msg" id="status-msg"></p>
    </div>
  </div>
</main>

<footer>ambiente de checkout · os preços são sempre confirmados pelo servidor</footer>

<script>
  // Ajuste estas rotas para bater com o seu arquivo mercadopagoRoutes.
  const API = {
    produtos: '/api/mercadopago/produtos',
    pedidos: '/api/mercadopago/pedidos',
    preferencia: '/api/mercadopago/preferencia',
  };

  const estadoProdutosEl = document.getElementById('estado-produtos');
  const produtosListaEl = document.getElementById('produtos-lista');
  const contagemEl = document.getElementById('contagem-produtos');
  const carrinhoItensEl = document.getElementById('carrinho-itens');
  const totalValorEl = document.getElementById('total-valor');
  const btnPagar = document.getElementById('btn-pagar');
  const statusMsgEl = document.getElementById('status-msg');

  let produtos = [];
  const carrinho = {}; // { produtoId: quantidade }

  function formatarMoeda(v){
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  async function carregarProdutos(){
    try{
      const resp = await fetch(API.produtos);
      if(!resp.ok) throw new Error('Falha ao buscar produtos.');
      produtos = await resp.json();

      if(!Array.isArray(produtos) || produtos.length === 0){
        produtosListaEl.innerHTML = '<div class="estado">nenhum produto disponível no momento</div>';
        contagemEl.textContent = '';
        return;
      }

      contagemEl.textContent = produtos.length + ' item(ns)';
      renderizarProdutos();
    }catch(erro){
      console.error(erro);
      produtosListaEl.innerHTML = '<div class="estado erro">não foi possível carregar os produtos. verifique se o servidor está no ar.</div>';
    }
  }

  function renderizarProdutos(){
    produtosListaEl.innerHTML = produtos.map((p) => {
      const estoqueBaixo = p.estoque <= 5;
      return `
        <div class="produto" data-id="${p.id}">
          <div>
            <div class="nome">${escapeHtml(p.nome)}</div>
            ${p.descricao ? `<div class="descricao">${escapeHtml(p.descricao)}</div>` : ''}
            <div class="estoque ${estoqueBaixo ? 'baixo' : ''}">${p.estoque > 0 ? p.estoque + ' em estoque' : 'sem estoque'}</div>
          </div>
          <div class="preco">${formatarMoeda(Number(p.preco))}</div>
          <div class="qtd-control">
            <button type="button" data-acao="menos" aria-label="diminuir quantidade">−</button>
            <input type="number" min="0" max="${p.estoque}" value="${carrinho[p.id] || 0}" data-acao="input" aria-label="quantidade">
            <button type="button" data-acao="mais" aria-label="aumentar quantidade">+</button>
          </div>
        </div>
      `;
    }).join('');

    produtosListaEl.querySelectorAll('.produto').forEach((el) => {
      const id = Number(el.dataset.id);
      const produto = produtos.find((p) => p.id === id);
      const input = el.querySelector('input');

      el.querySelector('[data-acao="menos"]').addEventListener('click', () => {
        atualizarQuantidade(id, (carrinho[id] || 0) - 1, produto.estoque);
      });
      el.querySelector('[data-acao="mais"]').addEventListener('click', () => {
        atualizarQuantidade(id, (carrinho[id] || 0) + 1, produto.estoque);
      });
      input.addEventListener('change', () => {
        atualizarQuantidade(id, Number(input.value) || 0, produto.estoque);
      });
    });
  }

  function atualizarQuantidade(id, novaQtd, estoqueMax){
    const qtd = Math.max(0, Math.min(novaQtd, estoqueMax));
    if(qtd === 0){
      delete carrinho[id];
    }else{
      carrinho[id] = qtd;
    }
    renderizarProdutos();
    renderizarCarrinho();
    limparStatus();
  }

  function renderizarCarrinho(){
    const ids = Object.keys(carrinho);

    if(ids.length === 0){
      carrinhoItensEl.innerHTML = '<p class="carrinho-vazio">seu carrinho está vazio</p>';
      totalValorEl.textContent = formatarMoeda(0);
      btnPagar.disabled = true;
      return;
    }

    let total = 0;
    carrinhoItensEl.innerHTML = ids.map((id) => {
      const produto = produtos.find((p) => p.id === Number(id));
      const qtd = carrinho[id];
      const subtotal = Number(produto.preco) * qtd;
      total += subtotal;
      return `
        <div class="item-linha">
          <span class="nome-item">${escapeHtml(produto.nome)}</span>
          <span class="qtd-item">×${qtd}</span>
          <span class="valor-item">${formatarMoeda(subtotal)}</span>
        </div>
      `;
    }).join('');

    totalValorEl.textContent = formatarMoeda(total);
    btnPagar.disabled = false;
  }

  function limparStatus(){
    statusMsgEl.textContent = '';
    statusMsgEl.className = 'status-msg';
  }

  function mostrarStatus(msg, tipo){
    statusMsgEl.textContent = msg;
    statusMsgEl.className = 'status-msg ' + (tipo || '');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  btnPagar.addEventListener('click', async () => {
    const itens = Object.entries(carrinho).map(([produtoId, quantidade]) => ({
      produtoId: Number(produtoId),
      quantidade,
    }));

    if(itens.length === 0) return;

    btnPagar.disabled = true;
    mostrarStatus('criando pedido…');

    try{
      const respPedido = await fetch(API.pedidos, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itens }),
      });
      const dadosPedido = await respPedido.json();

      if(!respPedido.ok){
        throw new Error(dadosPedido.erro || 'Não foi possível criar o pedido.');
      }

      mostrarStatus('gerando link de pagamento…');

      const respPref = await fetch(API.preferencia, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pedidoId: dadosPedido.pedidoId }),
      });
      const dadosPref = await respPref.json();

      if(!respPref.ok){
        throw new Error(dadosPref.erro || 'Não foi possível gerar o pagamento.');
      }

      mostrarStatus('redirecionando para o Mercado Pago…', 'ok');
      window.location.href = dadosPref.initPoint;
    }catch(erro){
      console.error(erro);
      mostrarStatus(erro.message, 'erro');
      btnPagar.disabled = false;
    }
  });
  //asdasd

  carregarProdutos();
</script>

</body>
</html>
